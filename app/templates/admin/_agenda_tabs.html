{% from "_macros.html" import page_header %}
{% call page_header('fa-clock', 'Horario de atención (HU-05)', p.nombre ~ ' · ' ~ (p.especialidad or 'Sin especialidad') ~ ('' if p.activo else ' · INACTIVO')) %}
  <a class="btn btn-outline-secondary" href="{{ url_for('admin.usuarios') }}"><i class="fa-solid fa-arrow-left me-1"></i>Volver</a>
{% endcall %}
<ul class="nav nav-tabs mb-3">
  <li class="nav-item"><a class="nav-link {{ 'active' if tab == 'semanal' }}" href="{{ url_for('admin.horarios', pid=p.id) }}"><i class="fa-regular fa-calendar me-1"></i>Horario semanal</a></li>
  <li class="nav-item"><a class="nav-link {{ 'active' if tab == 'excepciones' }}" href="{{ url_for('admin.excepciones', pid=p.id) }}"><i class="fa-solid fa-calendar-xmark me-1"></i>Excepciones</a></li>
</ul>
