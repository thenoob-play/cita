{% extends "base.html" %}
{% block title %}Nueva contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <div class="card fade-up"><div class="card-body p-4">
    <h3 class="fw-bold mb-3"><i class="fa-solid fa-lock me-2"></i>Nueva contraseña</h3>
    <form method="post" class="needs-validation" autocomplete="off">
      {{ csrf_field() }}
      <div class="mb-3"><label class="form-label" for="password">Nueva contraseña</label>
        <input class="form-control" type="password" id="password" name="password" required minlength="6" autocomplete="new-password"></div>
      <div class="mb-3"><label class="form-label" for="password2">Repita la contraseña</label>
        <input class="form-control" type="password" id="password2" name="password2" required minlength="6" autocomplete="new-password"></div>
      <button class="btn btn-brand w-100" type="submit">Guardar contraseña</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
