{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="text-center py-5 fade-up">
  <div class="display-1 fw-bold text-secondary">{{ code }}</div>
  <h2 class="fw-bold mt-2">{{ titulo }}</h2>
  <p class="text-muted mx-auto" style="max-width:560px">{{ mensaje }}</p>
  <a href="{{ url_for('auth.index') }}" class="btn btn-brand mt-2"><i class="fa-solid fa-house me-1"></i>Volver al inicio</a>
</div>
{% endblock %}
