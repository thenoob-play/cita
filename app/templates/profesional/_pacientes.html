<div class="list-group list-group-flush">
  {% for p in pacientes %}
    <a href="{{ url_for('profesional.historial_paciente', paciente_id=p.id) }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center px-1">
      <div><div class="fw-semibold">{{ p.nombre }}</div><small class="text-muted">Doc: {{ p.documento }}</small></div>
      <i class="fa-solid fa-chevron-right text-muted"></i>
    </a>
  {% else %}
    <div class="empty-state py-3"><i class="fa-solid fa-user-slash"></i>No hay pacientes para mostrar.</div>
  {% endfor %}
</div>
